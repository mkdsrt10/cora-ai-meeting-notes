<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Cora Recording</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      color: #f1f5f9;
    }
    .floater-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 3px;
    }
    .floater-pill {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: rgba(20, 20, 24, 0.88);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(255, 255, 255, 0.1) inset;
      -webkit-app-region: drag;
    }
    .drag-handle {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: grab;
      flex-shrink: 0;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
      flex-shrink: 0;
    }
    .pulse-dot.paused {
      background: #f59e0b;
      animation: none;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .timer {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 11.5px;
      letter-spacing: 0.02em;
      color: #f8fafc;
      min-width: 36px;
    }
    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }
    .audio-meters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .meter-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .meter-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #94a3b8;
      width: 22px;
      text-align: right;
    }
    .meter-track {
      width: 38px;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: #10b981;
      transition: width 0.08s linear, background-color 0.15s ease;
    }
    .meter-fill.quiet {
      background: #f59e0b;
    }
    .meter-fill.loud {
      background: #ef4444;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      -webkit-app-region: no-drag;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 10.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
      outline: none;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #ffffff;
      border-color: rgba(239, 68, 68, 0.5);
    }
    .btn-muted {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: rgba(239, 68, 68, 0.4) !important;
      color: #fca5a5 !important;
    }
    .note-drawer {
      display: none;
      width: 100%;
      background: rgba(20, 20, 24, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 6px 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      -webkit-app-region: no-drag;
    }
    .note-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-family: inherit;
      font-size: 11.5px;
      padding: 4px;
    }
    .note-input::placeholder {
      color: #64748b;
    }
    .note-hint {
      font-size: 9px;
      color: #64748b;
      margin-top: 2px;
      padding: 0 4px;
      display: flex;
      justify-content: space-between;
    }
    .toast {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.9);
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.2s ease, top 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      top: -30px;
    }
  </style>
</head>
<body>
  <div class="toast" id="toast">Slide snapped!</div>
  <div class="floater-wrapper">
    <div class="floater-pill">
      <div class="drag-handle" title="Drag to reposition">
        <span class="pulse-dot" id="liveDot"></span>
        <span class="timer" id="timer">00:00</span>
      </div>

      <div class="divider"></div>

      <!-- Live Audio Level Health Meters -->
      <div class="audio-meters" title="Audio Levels: Keep 'You' green for clear transcription">
        <div class="meter-group">
          <span class="meter-label">You</span>
          <div class="meter-track">
            <div class="meter-fill" id="meterMic"></div>
          </div>
        </div>
        <div class="meter-group">
          <span class="meter-label">Sys</span>
          <div class="meter-track">
            <div class="meter-fill" id="meterSys"></div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Quick Action Controls -->
      <div class="actions">
        <button class="btn" id="btnSnap" title="Snap current slide with OCR (Cmd+Shift+S)">📸 Snap</button>
        <button class="btn" id="btnMute" title="Mute your microphone so private moments aren't recorded">🎤 Mute</button>
        <button class="btn" id="btnPause" title="Pause / Resume recording">⏸</button>
        <button class="btn" id="btnNote" title="Add a quick note">📝</button>
        <button class="btn btn-danger" id="btnStop" title="Stop & Finalize meeting">⏹</button>
        <button class="btn" id="btnOpen" title="Open Cora dashboard">↗</button>
      </div>
    </div>

    <!-- Quick Note Inline Drawer -->
    <div class="note-drawer" id="noteDrawer">
      <input type="text" class="note-input" id="noteInput" placeholder="Type a quick note & hit Enter…">
      <div class="note-hint">
        <span>Appends with timestamp to meeting notes</span>
        <span>Esc to close</span>
      </div>
    </div>
  </div>

  <script src="floater.js"></script>
</body>
</html>
