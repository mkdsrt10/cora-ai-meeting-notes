<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Cora Recording</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      color: #f1f5f9;
    }
    .floater-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 3px;
    }
    /* Matches the v2 shell: near-black glass, one purple accent, icon buttons. */
    .floater-pill {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px 0 12px;
      background: rgba(20, 20, 22, 0.92);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      -webkit-app-region: drag;
    }
    .drag-handle {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: grab;
      flex-shrink: 0;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f04444;
      animation: pulse 1.6s infinite;
      flex-shrink: 0;
    }
    .pulse-dot.paused {
      background: #e0a23a;
      animation: none;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(240, 68, 68, 0.55); }
      70% { box-shadow: 0 0 0 5px rgba(240, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(240, 68, 68, 0); }
    }
    .timer {
      font-variant-numeric: tabular-nums;
      font-weight: 560;
      font-size: 12.5px;
      color: #f4f4f5;
      min-width: 38px;
    }
    .divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }
    .audio-meters {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .meter-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .meter-label {
      font-size: 10px;
      font-weight: 500;
      color: #a1a1aa;
    }
    .meter-track {
      width: 34px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: #8b8bf0;
      transition: width 0.08s linear, background-color 0.15s ease;
    }
    .meter-fill.quiet {
      background: #e0a23a;
    }
    .meter-fill.loud {
      background: #f04444;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
      -webkit-app-region: no-drag;
    }
    .btn {
      width: 28px;
      height: 28px;
      background: transparent;
      border: 0;
      color: #d4d4d8;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.12s ease, color 0.12s ease;
      outline: none;
    }
    .btn svg { width: 15px; height: 15px; }
    .btn:hover { background: rgba(255, 255, 255, 0.09); color: #ffffff; }
    .btn:focus-visible { box-shadow: 0 0 0 2px #8b8bf0; }
    .btn:active { transform: scale(0.94); }
    .btn-danger { background: #e5484d; color: #ffffff; margin-left: 4px; }
    .btn-danger:hover { background: #f05358; }
    .btn-muted { background: rgba(229, 72, 77, 0.2) !important; color: #ff9592 !important; }
    .note-drawer {
      display: none;
      width: 100%;
      background: rgba(20, 20, 22, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 6px 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      -webkit-app-region: no-drag;
    }
    .note-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-family: inherit;
      font-size: 11.5px;
      padding: 4px;
    }
    .note-input::placeholder {
      color: #64748b;
    }
    .note-hint {
      font-size: 9px;
      color: #64748b;
      margin-top: 2px;
      padding: 0 4px;
      display: flex;
      justify-content: space-between;
    }
    /* Live transcript captions (docs/specs/live-transcript.md): shown only
       while the Live transcript is on; You / Them by track. */
    .live-captions {
      width: 100%;
      background: rgba(20, 20, 22, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      padding: 5px 9px;
      -webkit-app-region: drag;
    }
    .live-captions[hidden] { display: none; }
    .live-head {
      display: flex;
      gap: 6px;
      align-items: center;
      min-height: 0;
    }
    .live-badge, .live-paused {
      font-size: 9px;
      font-weight: 600;
      border-radius: 999px;
      padding: 0 6px;
    }
    .live-badge { background: rgba(139, 139, 240, 0.22); color: #c7c7fb; }
    .live-paused { background: rgba(245, 158, 11, 0.25); color: #fcd34d; }
    .live-badge[hidden], .live-paused[hidden] { display: none; }
    .caption-line {
      font-size: 11.5px;
      line-height: 15px;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;          /* keep the newest words visible */
      text-align: left;
    }
    .caption-line bdi { direction: ltr; unicode-bidi: plaintext; }
    .caption-line .who { color: #94a3b8; font-weight: 600; }
    .caption-line.partial bdi { color: #cbd5e1; }
    .caption-empty { font-size: 10.5px; color: #64748b; }
    .toast {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(91, 91, 214, 0.95);
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.2s ease, top 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      top: -30px;
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="floater-wrapper">
    <div class="floater-pill">
      <div class="drag-handle" title="Drag to reposition">
        <span class="pulse-dot" id="liveDot"></span>
        <span class="timer" id="timer">00:00</span>
      </div>

      <div class="divider"></div>

      <!-- Live Audio Level Health Meters -->
      <div class="audio-meters" title="Audio Levels: Keep 'You' green for clear transcription">
        <div class="meter-group" id="meterMicGroup" title="Your microphone">
          <span class="meter-label">You</span>
          <div class="meter-track">
            <div class="meter-fill" id="meterMic"></div>
          </div>
        </div>
        <div class="meter-group">
          <span class="meter-label">Them</span>
          <div class="meter-track">
            <div class="meter-fill" id="meterSys"></div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Quick Action Controls -->
      <div class="actions">
        <button class="btn" id="btnSnap" title="Snap the current slide (⌘⇧S)" aria-label="Snap slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="btn" id="btnMute" title="Mute your microphone so private moments aren't recorded" aria-label="Mute microphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
        <button class="btn" id="btnPause" title="Pause recording" aria-label="Pause recording"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
        <button class="btn" id="btnNote" title="Add a quick note" aria-label="Add a quick note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg></button>
        <button class="btn" id="btnOpen" title="Open Cora" aria-label="Open Cora"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></button>
        <button class="btn btn-danger" id="btnStop" title="Stop and process the meeting" aria-label="Stop recording"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor"/></svg></button>
      </div>
    </div>

    <!-- Live transcript captions -->
    <div class="live-captions" id="liveCaptions" hidden>
      <div class="live-head">
        <span class="live-badge" id="liveCloudBadge" title="Audio is streaming to Google Cloud Speech-to-Text on your Vertex project" hidden>Live: Cloud</span>
        <span class="live-paused" id="livePaused" title="The recording continues; only the captions stopped" hidden>Live captions paused</span>
      </div>
      <div id="captionLines"><div class="caption-empty">Captions appear here as people speak.</div></div>
    </div>
    <!-- Quick Note Inline Drawer -->
    <div class="note-drawer" id="noteDrawer">
      <input type="text" class="note-input" id="noteInput" placeholder="Type a quick note & hit Enter…">
      <div class="note-hint">
        <span>Appends with timestamp to meeting notes</span>
        <span>Esc to close</span>
      </div>
    </div>
  </div>

  <script src="floater.js"></script>
</body>
</html>
