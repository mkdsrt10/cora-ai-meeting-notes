<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Cora Call</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px; color: #f1f5f9;
    }
    .wrap { width: 100%; padding: 3px; }
    .panel {
      height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
      background: rgba(20, 20, 24, 0.88);
      backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(255, 255, 255, 0.1) inset;
      -webkit-app-region: drag;
    }
    .text { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button {
      -webkit-app-region: no-drag; font: inherit; font-weight: 600; cursor: pointer;
      border-radius: 8px; padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08); color: #f1f5f9;
    }
    button.primary { background: #ef4444; border-color: #ef4444; color: #fff; }
    button:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="text" id="text">Call detected</div>
      <button id="btnDismiss" type="button">Dismiss</button>
      <button id="btnStart" type="button" class="primary">Start recording</button>
    </div>
  </div>
  <script src="call-prompt.js"></script>
</body>
</html>
