name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't attach real recordings, transcripts or screenshots with meeting content. For security issues use private reporting (see SECURITY.md)."
  - type: textarea
    id: what
    attributes: {label: What happened?, description: What did you expect instead?}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: mac
    attributes: {label: Mac and macOS version, placeholder: "e.g. M1 Pro 16 GB, macOS 26.0"}
    validations: {required: true}
  - type: input
    id: models
    attributes: {label: Models in use, placeholder: "e.g. whisper-small-mlx / Qwen3-4B"}
  - type: textarea
    id: logs
    attributes: {label: Relevant log output, description: "From the terminal running `make dev`, or `python tools/traces.py runs`. Remove any meeting content.", render: text}
