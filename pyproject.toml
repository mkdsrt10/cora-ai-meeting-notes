[project]
name = "cora"
version = "0.1.0"
description = "Cora AI Meeting Notes: local-first meeting memory for macOS: capture, transcribe, and summarize meetings on Apple Silicon."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Apple Silicon only — mlx/mlx-whisper/mlx-lm require Metal.
# System dependency (not pip-installable): `brew install ffmpeg`.
dependencies = [
    "mlx>=0.32",
    "mlx-metal>=0.32",
    "mlx-whisper>=0.4",
    "mlx-lm>=0.31",
    "numpy>=2.2",
    "json-repair>=0.63",
    "requests>=2.32",
    "mcp>=2.2",
]

[project.optional-dependencies]
# Cloud diarization / coaching via Gemini (opt-in; blocked under enterprise lockdown).
cloud = ["google-genai>=2.20"]
# Langfuse tracing (opt-in, bring your own project keys).
tracing = ["langfuse>=4.15"]
# Model conversion and dataset tools in tools/.
tools = ["huggingface_hub>=1.3", "torch>=2.4", "tqdm>=4.66", "jiwer>=4.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["node_modules", "backups", "dist"]

[tool.ruff.lint]
# Start with correctness-focused rules; tighten over time.
select = ["E9", "F63", "F7", "F82", "F401", "B006", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = ["mlx: needs Apple Silicon + downloaded models (skipped in CI)"]
